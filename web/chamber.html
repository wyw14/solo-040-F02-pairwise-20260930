<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Chamber</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a aria-current="page" href="/chamber">Chamber</a><a href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Chamber situation</h1><div class="muted">Gate, cycle, queue and signal state</div></div><button id="refresh">Refresh</button></div><div class="grid" id="chambers"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,shortID,setMessage}=window.LockFlow; const host=document.querySelector('#chambers'); const message=document.querySelector('#message');
const STATE_LABEL={standby:'待命',allowed:'允许',entered:'已进入',withdrawn:'撤回'};
const esc=(v)=>String(v??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function queueTable(queue){
  if(!queue||!queue.length) return '<div class="muted">队列为空</div>';
  return '<table><thead><tr><th>#</th><th>船名</th><th>呼号</th><th>状态</th><th>备注</th></tr></thead><tbody>'+
    queue.map((e)=>`<tr><td>${e.sequence+1}</td><td>${esc(e.vessel.name)}</td><td>${esc(e.vessel.call_sign)}</td>
      <td><span class="badge ${e.state}">${STATE_LABEL[e.state]||e.state}</span></td><td class="muted">${esc(e.reason||'')}</td></tr>`).join('')+
    '</tbody></table>';
}
async function load(){
  const items=await api('/api/chambers');
  host.innerHTML=items.map((item)=>`<section class="panel wide">
    <h2>${item.chamber_id}</h2>
    <div class="metrics"><div class="metric">Stage<strong>${item.cycle?.stage||'idle'}</strong></div>
    <div class="metric">Upstream<strong>${item.gates?.upstream||'-'}</strong></div>
    <div class="metric">Downstream<strong>${item.gates?.downstream||'-'}</strong></div></div>
    <table><tr><th>Cycle</th><td>${shortID(item.cycle?.id)}</td></tr>
    <tr><th>Queue</th><td>${item.queue?.length||0} vessel(s)</td></tr>
    <tr><th>Emergency</th><td>${item.emergency?.status||'idle'}</td></tr></table>
    <h2>船队入闸进度</h2>${queueTable(item.queue)}
  </section>`).join('');
  setMessage(message,'');
}
document.querySelector('#refresh').addEventListener('click',()=>load().catch((e)=>setMessage(message,e.message))); load().catch((e)=>setMessage(message,e.message));
</script></body></html>
